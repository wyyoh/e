name: LaTeX review source export
on:
  push:
    branches: [paper/template-2026-review-20260925]
    paths: [.github/workflows/latex-review-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package existing paper inputs without fonts
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          paths = [Path('paper/latex'), Path('problems/D/q1/figures'), Path('paper/figures'), Path('paper/data'), Path('paper_integration/FINAL_SELECTION.json')]
          with ZipFile('latex-review-source.zip', 'w', ZIP_DEFLATED) as archive:
              for root in paths:
                  for file in (root.rglob('*') if root.is_dir() else [root]):
                      if file.is_file() and file.suffix.lower() not in {'.otf', '.ttf', '.ttc', '.woff', '.woff2'}:
                          archive.write(file, file.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: latex-review-source
          path: latex-review-source.zip
          retention-days: 7
