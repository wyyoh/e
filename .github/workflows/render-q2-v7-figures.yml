name: Render Q2 V7 figures

on:
  push:
    branches: [main]
    paths:
      - "paper/data/q2_v7_visual_source.json"
      - "paper/scripts/generate_q2_v7_figures.py"
      - ".github/workflows/render-q2-v7-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install matplotlib
      - name: Render Q2 figures
        run: python paper/scripts/generate_q2_v7_figures.py
      - name: Commit rendered figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/figures/q2
          if git diff --cached --quiet; then
            echo "No figure changes."
          else
            git commit -m "Render formal Q2 V7 figures"
            git push origin HEAD:main
          fi
