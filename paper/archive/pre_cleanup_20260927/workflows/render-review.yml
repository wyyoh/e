name: Render Review PDF

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale generated chapters
        run: rm -f paper/latex/chapters/00_abstract.tex paper/latex/chapters/0[1-9].tex
      - name: Compile XeLaTeX review PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/latex
          root_file: main.tex
          latexmk_use_xelatex: true
      - name: Package PDF
        run: |
          mkdir -p review-output
          cp paper/latex/main.pdf 'review-output/D题论文_2026华为杯_检阅版.pdf'
      - uses: actions/upload-artifact@v4
        with:
          name: review-pdf
          path: review-output/*.pdf
          if-no-files-found: error
